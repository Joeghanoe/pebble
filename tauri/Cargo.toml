[package]
name = "pebble"
version = "0.0.1"
description = "Pebble Desktop — a thin client over the hosted deployment"
authors = ["Joeghanoe Bhatti"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pebble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The shell no longer runs a backend, so most of what was here is gone:
# tauri-plugin-shell (spawned the PyInstaller sidecar), ureq (polled its health
# endpoint), axum + tokio + tower-http (the Unix socket server FastAPI called back
# through), envy + once_cell (read the sidecar's host/port), tauri-plugin-biometry (the
# local unlock gate; the deployment is behind Google sign-in now) and the generated
# `client` crate, which nothing imported.
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
