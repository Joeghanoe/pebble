<!doctype html>
<!-- Pebble ships one dark palette; `dark` is pinned so the shadcn primitives
     resolve to it without a runtime theme provider. -->
<html lang="en" class="dark" data-pb-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pebble</title>
    <!-- Named because this is what a phone shows under the home-screen icon. -->
    <meta name="apple-mobile-web-app-title" content="Pebble" />
    <meta name="theme-color" content="#08070c" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
