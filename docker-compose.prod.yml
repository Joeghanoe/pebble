# Self-hosted Pebble: the same four pieces as the Railway project, on one Docker host.
#
#   cp .env.example .env    # fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only `proxy` publishes a port. Put TLS in front of it (Caddy, Traefik, a cloud load
# balancer): the session cookie is Secure by default and browsers will not send it over
# plain HTTP. The api trusts the identity header oauth2-proxy sets, so it must never get
# a published port of its own -- anyone who can reach it can claim to be anyone.
#
# Any OIDC provider works (Google, Keycloak, Zitadel, Authentik, Entra ID, ...): set
# OAUTH2_PROXY_PROVIDER=oidc and OAUTH2_PROXY_OIDC_ISSUER_URL, or keep `google`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pebble
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pebble
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pebble -d pebble"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://pebble:${POSTGRES_PASSWORD}@postgres:5432/pebble
      MIGRATE_ON_STARTUP: "true"
      REQUIRE_PROXY_IDENTITY: "true"
      # The second gate. Required here, because empty means "anyone the proxy admits".
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?set ALLOWED_EMAILS in .env}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      PRICE_PROVIDERS: ${PRICE_PROVIDERS:-coingecko,stooq,yahoo}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: infra/web.Dockerfile }
    restart: unless-stopped
    environment:
      PORT: "8080"

  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.2
    restart: unless-stopped
    ports: ["${PROXY_PORT:-4180}:4180"]
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: http://web:8080/,http://api:8080/api/
      OAUTH2_PROXY_PROVIDER: ${OAUTH2_PROXY_PROVIDER:-google}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:-}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set OAUTH2_PROXY_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}
      OAUTH2_PROXY_REDIRECT_URL: ${PEBBLE_URL:?set PEBBLE_URL in .env}/oauth2/callback
      # Same reasoning as .railway/railway.ts: ALLOWED_EMAILS on the api decides whose
      # session is served; restrict at the provider too where it can.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 720h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
    depends_on: [api, web]

volumes:
  pgdata:
