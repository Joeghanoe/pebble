# Local stand-in for oauth2-proxy (docker-compose `edge`). Not for deployment.
#
# It does the two things the real proxy does — route /api/ to the api and everything
# else to web, and stamp an identity header — without needing a Google account. The
# address matches ALLOWED_EMAILS in docker-compose.yml so the allowlist is exercised
# too, rather than being something that only ever runs in production.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header X-Forwarded-Email dev@pebble.local;
        proxy_set_header Host $host;
    }

    # oauth2-proxy serves this itself. Locally there is no session to end, so say so
    # rather than letting the SPA's sign-out link fall through to the SPA.
    location /oauth2/sign_out {
        default_type text/plain;
        return 200 'Local edge: there is no session to sign out of. The real proxy serves this path.';
    }

    location / {
        proxy_pass http://web:8080/;
        proxy_set_header Host $host;
    }
}
