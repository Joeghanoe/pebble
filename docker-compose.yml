# Local stack without Google: api + web + postgres. The vite dev server (or the `edge`
# service below) fakes the identity header oauth2-proxy would set. See README.md.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pebble
      POSTGRES_PASSWORD: pebble
      POSTGRES_DB: pebble
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pebble"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://pebble:pebble@postgres:5432/pebble
      MIGRATE_ON_STARTUP: "true"
      # The edge stamps dev@pebble.local; keeping the allowlist populated locally means
      # the same code path runs here as in the deployment.
      ALLOWED_EMAILS: dev@pebble.local
      REQUIRE_PROXY_IDENTITY: "true"
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: infra/web.Dockerfile }
    environment:
      PORT: "8080"

  # Stands in for oauth2-proxy: routes /api to the api, the rest to web, and stamps a
  # fixed identity. Never deploy this; it is the thing oauth2-proxy exists to replace.
  edge:
    image: nginx:1.27-alpine
    ports: ["3000:80"]
    volumes:
      - ./infra/local-edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]

volumes:
  pgdata:
